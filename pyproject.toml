[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes (imports inutilisés, variables inutilisées, etc.)
    "I",  # isort (tri des imports)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: end-to-end tests against a live Flask server and a real headless browser",
]
