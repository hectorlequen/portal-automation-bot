services:
  demo_portal:
    build:
      context: ./demo_portal
    env_file:
      - .env
    ports:
      - "5000:5000"

  bot:
    build:
      context: .
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./downloads:/app/downloads
    command: ["python", "-m", "app.cli", "--site", "demo_portal_docker", "--no-display-browser"]
    depends_on:
      - demo_portal
